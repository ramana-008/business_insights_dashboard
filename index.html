<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business insights dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#0f172a;--mute:#5f6e86;--line:#e1e6f0;--a:#2f5bea;--c1:#2f5bea;--c2:#f2a33a;--c3:#12a594;--c4:#8a5cf6;--c5:#e5548a;--ok:#15803d;--warn:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#131b2e;--ink:#e7ecf6;--mute:#97a5bf;--line:#243049;--a:#6b8cff;--c1:#5b82ff;--ok:#4ade80;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#131b2e;--ink:#e7ecf6;--mute:#97a5bf;--line:#243049;--a:#6b8cff;--c1:#5b82ff;--ok:#4ade80;--warn:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.ttl{font-size:14px;font-weight:700}.sub{font-size:12px;color:var(--mute);margin-bottom:10px}.mute{color:var(--mute)}
.hero{border-radius:14px;padding:16px 18px;color:#fff;min-width:0}
.chip{display:inline-block;font-size:11px;font-weight:600;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 8px;margin-top:6px}
.btn{background:var(--a);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.fld{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink);min-width:0;max-width:200px}
.fld.sm{padding:3px 8px;font-size:12px}
table{width:100%;font-size:12px;border-collapse:collapse}th{text-align:right;font-weight:600;color:var(--mute);padding:4px 6px}td{text-align:right;padding:5px 6px;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left;padding-left:0}
html{scroll-behavior:smooth}
.card,.hero,.btn,.fld{transition:transform .25s ease,box-shadow .25s ease,background-color .2s,border-color .2s,filter .2s}
.card:hover,.hero:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,23,42,.12)}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.fld:hover{border-color:var(--a)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.anim{animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
.bar{transition:width .9s cubic-bezier(.2,.7,.2,1)}
.spin{animation:spin .8s linear infinite}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;animation:pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="max-w-[1400px] mx-auto p-4 md:p-6 space-y-4">

<header class="card flex flex-wrap items-center gap-3">
  <div class="mr-auto min-w-[220px]">
    <h1 class="text-xl font-extrabold">Business insights dashboard</h1>
    <div id="st" class="text-xs mute">Loading sample data…</div>
    <div id="sync" class="text-[11px] mute mt-0.5"></div>
  </div>
  <label class="btn" tabindex="0">Upload CSV or Excel<input id="file" type="file" accept=".csv,.xlsx,.xls" hidden></label>
  <div class="flex gap-2 min-w-[240px] max-w-sm flex-1">
    <input id="url" class="fld flex-1 !max-w-none" placeholder="Paste a Google Sheets link" aria-label="Google Sheets link" value="https://docs.google.com/spreadsheets/d/1_K_Hx_blHkQMtUpQGVIJ0vn6wac9ZLaEy3WW6S9dioo/edit?usp=sharing">
    <button id="conn" class="btn">Connect</button>
  </div>
  <button id="rf" class="btn" aria-label="Refresh data now" title="Re-read the connected Google Sheet now"><span id="rfi" style="display:inline-block">↻</span> Refresh</button>
  <label class="text-xs mute flex items-center gap-1 cursor-pointer"><input id="auto" type="checkbox" checked> Auto-refresh 1 min</label>
  <select id="mp" class="fld hidden" aria-label="Measure"></select>
  <select id="fd" class="fld" aria-label="Filter by"></select>
  <select id="fv" class="fld" aria-label="Filter value"></select>
  <select id="cur" class="fld" aria-label="Currency"><option value="">No currency</option><option>₹</option><option>$</option><option>€</option><option>£</option></select>
</header>

<div class="grid xl:grid-cols-4 gap-4 items-start">
<main class="xl:col-span-3 space-y-4 min-w-0">
  <section id="hero" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3"></section>
  <section id="mini" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3"></section>
  <section class="grid lg:grid-cols-5 gap-4">
    <div class="card lg:col-span-3"><div class="ttl" id="c1t"></div><div class="sub" id="c1s"></div><div class="h-64"><canvas id="c1"></canvas></div></div>
    <div class="card lg:col-span-2"><div class="ttl" id="mixt"></div><div class="sub">Detected from this dataset</div><div id="mix" class="space-y-3"></div></div>
  </section>
  <section class="grid md:grid-cols-3 gap-4">
    <div class="card"><div class="flex justify-between gap-2 items-start"><div class="ttl" id="d1t"></div><select id="da" class="fld sm" aria-label="Split by"></select></div><div class="h-60 mt-2"><canvas id="c3"></canvas></div></div>
    <div class="card"><div class="flex justify-between gap-2 items-start"><div class="ttl" id="d2t"></div><select id="db" class="fld sm" aria-label="Compare by"></select></div><div class="h-60 mt-2"><canvas id="c4"></canvas></div></div>
    <div class="card overflow-x-auto"><div class="ttl mb-2">Segment table</div><div id="tbl"></div></div>
  </section>
</main>
<aside class="card xl:sticky xl:top-4">
  <div class="ttl">Growth insights</div><div class="sub">Written from the data currently loaded</div>
  <ul id="ins" class="space-y-3 text-[13px] leading-relaxed"></ul>
</aside>
</div>
</div>

<script>
const $=i=>document.getElementById(i),css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sum=(a,f)=>a.reduce((s,r)=>s+f(r),0),uniq=a=>[...new Set(a)];
const grp=(a,k)=>{const m=new Map(),f=typeof k==='function'?k:r=>r[k];a.forEach(r=>{const x=f(r);(m.get(x)||m.set(x,[]).get(x)).push(r)});return m};
const iso=d=>{d=new Date(+d+432e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toNum=x=>typeof x==='number'?x:parseFloat(String(x).replace(/[^0-9.\-eE]/g,'')),isD=x=>Object.prototype.toString.call(x)==='[object Date]';
const pc=(n,d=1)=>n==null||!isFinite(n)?'—':(n*100).toFixed(d)+'%';
const up=(g,t)=>g==null?'':`${g>=0?'▲':'▼'} ${(Math.abs(g)*100).toFixed(1)}% ${t}`;
const lab=k=>/^\d{4}-\d\d$/.test(k)?new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString('en',{month:'short',year:'2-digit'}):k;
let CUR='',U={pre:'',suf:''},DS=null,charts={},S={},FRESH=0,KEEPV='All',LIVE={id:null,gid:0,left:60,busy:false,at:null,err:'',sig:null};
const fmt=n=>{if(n==null||!isFinite(n))return '—';const a=Math.abs(n),c=a>=1e9?[n/1e9,'B']:a>=1e6?[n/1e6,'M']:a>=1e4?[n/1e3,'K']:[n,''];return U.pre+(c[1]?c[0].toFixed(1)+c[1]:a<10&&n%1?n.toFixed(2):Math.round(n).toLocaleString())+U.suf};
function st(msg,err){$('st').textContent=msg;$('st').style.color=err?'var(--warn)':'var(--mute)'}

/* ---------- ingestion: profile columns, join lookup sheets, detect dataset type ---------- */
function ingest(sheets,name,keep){
  const fact=[...sheets].sort((a,b)=>b.rows.length-a.rows.length)[0];
  if(!fact||!fact.rows.length)return st('No rows found in that file.',1);
  let rows=fact.rows;const joined=[];
  sheets.filter(s=>s!==fact&&s.rows.length&&!/guide|readme|note|dictionary/i.test(s.n)).forEach(s=>{
    const k=Object.keys(s.rows[0])[0],add=Object.keys(s.rows[0]).filter(c=>!(c in rows[0]));
    if(!(k in rows[0])||!add.length)return;
    const m=new Map(s.rows.map(r=>[String(r[k]),r]));joined.push(s.n);
    rows=rows.map(r=>{const l=m.get(String(r[k]))||{},o={...r};add.forEach(c=>o[c]=l[c]??'');return o});
  });
  const cols=Object.keys(rows[0]),P={};
  cols.forEach(c=>{
    const v=rows.map(r=>r[c]).filter(x=>x!==''&&x!=null),n=v.length||1,u=uniq(v).length,
      d=v.filter(x=>isD(x)||(/^\d{4}-\d\d(-\d\d)?/.test(String(x))&&isNaN(+x))).length,
      m=v.filter(x=>typeof x==='number'||(String(x).trim()!==''&&!isNaN(+String(x).replace(/,/g,'')))).length;
    let t=d/n>.9?'date':m/n>.9?'num':'cat';
    if(t==='num'&&/^(year|yr)$/i.test(c)&&v.every(x=>x>1900&&x<2100))t='year';
    if(t==='num'&&/(^|_)id$|[a-z]I[dD]$/.test(c)&&u>.3*n)t='cat';
    P[c]={c,t,u,id:t==='cat'&&u>40&&u>.3*n};
  });
  const R2=rows.map(r=>{const o={};cols.forEach(c=>{const t=P[c].t,x=r[c];o[c]=t==='num'?(toNum(x)||0):t==='date'?(isD(x)?iso(x):String(x).slice(0,10)):t==='year'?+x:String(x??'')});return o});
  const nums=cols.filter(c=>P[c].t==='num'),cats=cols.filter(c=>P[c].t==='cat'),dateC=cols.find(c=>P[c].t==='date')||cols.find(c=>P[c].t==='year');
  const f=(l,re,ex)=>l.find(c=>re.test(c)&&!(ex&&ex.test(c)));
  const rev=[/sales.?amount|net.?sales|revenue/i,/sales/i,/total/i,/amount/i].map(re=>f(nums,re,/cost|disc|unit|price|tax|margin|profit|qty|quantity/i)).find(Boolean);
  const R={rev,cost:f(nums,/cost/i,/unit/i),qty:f(nums,/qty|quantity|units/i,/stock/i),disc:f(nums,/disc.*(pct|percent|rate)|discount$/i)||f(cats,/discount/i),status:f(cats,/status/i),cust:f(cats,/customer.?id|cust.?id|client|account/i)};
  const metric=cats.find(c=>/^(parameter|metric|indicator|measure|variable|series)$/i.test(c)),val=nums.find(c=>/^(value|val|amount)$/i.test(c));
  const mode=metric&&val&&dateC?'long':rev&&dateC?'sales':'generic';
  const sc=c=>/categ|product.?name|segment/i.test(c)?0:/region|country/i.test(c)?1:/channel|state|location|city|branch|store|rep|owner/i.test(c)?2:/id$/i.test(c)?4:3;
  const dims=cats.filter(c=>!P[c].id&&P[c].u>1&&P[c].u<=60&&c!==R.status&&c!==metric&&!/^unit/i.test(c)).sort((a,b)=>sc(a)-sc(b));
  const geo=dims.find(c=>/region|country|economy|area|state|location/i.test(c)),dt=dateC?R2.map(r=>Date.parse(r[dateC])):[];
  const asof=dt.length&&P[dateC].t==='date'?Math.max(...dt):0,span=asof?(asof-Math.min(...dt))/864e5+1:0,yr=dateC&&P[dateC].t==='year';
  const fine=!yr&&dateC&&uniq(R2.map(r=>r[dateC].slice(0,7))).length<=3;
  const tk=!dateC?()=>'All':yr?r=>String(r[dateC]):fine?r=>r[dateC]:r=>r[dateC].slice(0,7);
  DS={rows:R2,P,R,cols,dims,mode,dateC,metric,val,geo,asof,span,fine,tk,nums,name};FRESH=1;
  if(mode!=='long'&&/Tamil Nadu|Karnataka|Maharashtra|Uttar Pradesh/.test(JSON.stringify(R2.slice(0,80))))CUR='₹';
  $('cur').value=CUR;
  const OLD={...S};KEEPV=keep?OLD.fv:'All';S={fd:dims.find(c=>/categ/i.test(c))||'',fv:'All'};
  S.da=mode==='long'?(dims.find(c=>c!==geo)||dims[0]):(dims.find(c=>/categ/i.test(c))||dims[0]);
  S.db=mode==='long'?(geo||dims[0]):(dims.find(c=>/region|country/i.test(c)&&c!==S.da)||dims.find(c=>c!==S.da)||S.da);
  const mo=mode==='long'?uniq(R2.map(r=>r[metric])):mode==='generic'?nums.filter(c=>!P[c].id):[];
  S.mp=mode==='long'?(mo.find(x=>/sales/i.test(x)&&!/share/i.test(x))||mo[0]):mo[0];
  if(keep){if(OLD.fd===''||dims.includes(OLD.fd))S.fd=OLD.fd;['da','db'].forEach(k=>{if(dims.includes(OLD[k]))S[k]=OLD[k]});if(mo.includes(OLD.mp))S.mp=OLD.mp}
  $('mp').innerHTML=mo.map(x=>`<option>${x}</option>`).join('');$('mp').classList.toggle('hidden',!mo.length);if(mo.length)$('mp').value=S.mp;
  $('fd').innerHTML='<option value="">No filter</option>'+dims.map(c=>`<option>${c}</option>`).join('');$('fd').value=S.fd;
  ['da','db'].forEach(i=>{$(i).innerHTML=dims.map(c=>`<option>${c}</option>`).join('');$(i).value=S[i]});
  fillFv();
  st(`${name}: ${R2.length.toLocaleString()} rows read as ${mode==='sales'?'sales transactions':mode==='long'?'a time series with several metrics':'a general table'}${joined.length?'. Joined sheets: '+joined.join(', '):''}`);
  render();
}
function fillFv(){const v=S.fd?uniq(DS.rows.map(r=>r[S.fd])).sort():[];$('fv').innerHTML='<option value="All">All</option>'+v.map(x=>`<option>${x}</option>`).join('');$('fv').classList.toggle('hidden',!S.fd);S.fv=v.includes(KEEPV)?KEEPV:'All';KEEPV='All';$('fv').value=S.fv}

/* ---------- sales transactions: KPIs depend on which columns exist ---------- */
const topN=(a,n)=>{const t=a.slice(0,n),o=a.slice(n);return o.length?[...t,{n:'Other',s:sum(o,x=>x.s)}]:t};
function segIns(a,nm,tot,ov){
  const o=[];if(a.length<2||!tot)return o;
  const t3=a.slice(0,3).reduce((s,x)=>s+x.s,0)/tot;
  o.push(['g',`${a[0].n} leads ${nm} with ${pc(a[0].s/tot)} of sales${a.length>3?`; the top 3 hold ${pc(t3)}`:''}.`]);
  if(a.length>3){const l=a[a.length-1];o.push(['a',`${l.n} adds just ${pc(l.s/tot)} of sales. Review coverage or pricing there.`])}
  if(ov!=null){const wm=a.find(x=>x.m!=null&&x.s>=tot/a.length&&x.m<ov-.04);if(wm)o.push(['a',`${wm.n} sells well but earns ${pc(wm.m)} margin against ${pc(ov)} overall.`]);
    const bm=[...a].filter(x=>x.m!=null&&x.s>0).sort((x,y)=>y.m-x.m)[0];if(bm&&bm.n!==a[0].n)o.push(['g',`${bm.n} has the best margin (${pc(bm.m)}). Feature it in promotions.`])}
  const hr=[...a].filter(x=>x.rr!=null&&x.o>5).sort((x,y)=>y.rr-x.rr)[0];if(hr&&hr.rr>0)o.push(['a',`${hr.n} has the highest return rate (${pc(hr.rr)}). Check quality or delivery there.`]);
  return o;
}
function sales(rows){
  const D=DS,R=D.R,dc=D.dateC,v=r=>r[R.rev],cs=r=>R.cost?r[R.cost]:0,sc=R.status;
  const isRet=r=>sc&&(/return/i.test(sc)?/^(y|yes|true|1)$/i.test(r[sc]):/return|refund|cancel/i.test(r[sc])),isOpen=r=>sc&&!/return/i.test(sc)&&/confirm|pending|process|open|placed|new|ship|transit/i.test(r[sc]);
  const ok=rows.filter(r=>!isRet(r)),ret=rows.filter(isRet),open=rows.filter(isOpen),net=sum(ok,v),gp=net-sum(ok,cs),mg=R.cost&&net?gp/net:null;
  const age=r=>(D.asof-Date.parse(r[dc]))/864e5,h=D.span>=180?90:D.span>=60?Math.floor(D.span/2):0;
  const cu=ok.filter(r=>age(r)<h),pr=ok.filter(r=>age(r)>=h&&age(r)<2*h),g=h&&sum(pr,v)?sum(cu,v)/sum(pr,v)-1:null;
  const m=[...grp(ok,D.tk)].sort((a,b)=>a[0]<b[0]?-1:1),pk=[...m].sort((a,b)=>sum(b[1],v)-sum(a[1],v))[0];
  const agg=c=>[...grp(rows,c)].map(([n,a])=>{const o=a.filter(r=>!isRet(r)),s=sum(o,v);return{n,s,m:R.cost&&s?(s-sum(o,cs))/s:null,o:o.length,rr:sc?a.filter(isRet).length/a.length:null}}).sort((a,b)=>b.s-a.s);
  const A=agg(S.da),B=agg(S.db),custs=R.cust?uniq(ok.map(r=>r[R.cust])).length:0,units=R.qty?sum(ok,r=>r[R.qty]):0,numD=R.disc&&D.P[R.disc].t==='num';
  const dv=R.disc?(numD?sum(ok,r=>r[R.disc])/(ok.length||1):ok.filter(r=>/^(y|yes|true)$/i.test(r[R.disc])).length/(ok.length||1)):null;
  const K=[['Net sales',fmt(net),up(g,'vs prior '+h+' days')],['Total orders',rows.length.toLocaleString(),'all orders placed'],['Confirmed orders',ok.length.toLocaleString(),pc(ok.length/rows.length)+' kept · '+fmt(net)],sc&&['Returned orders',ret.length.toLocaleString(),pc(ret.length/rows.length)+' of orders · '+fmt(sum(ret,v))+' excluded'],R.cost&&['Gross profit',fmt(gp),'Margin '+pc(mg)],['Average order value',fmt(net/(ok.length||1))],
    open.length&&['Awaiting delivery',fmt(sum(open,v)),open.length+' confirmed, not yet delivered'],
    units&&['Units sold',Math.round(units).toLocaleString()],custs&&['Customers',custs,fmt(net/custs)+' each'],dv!=null&&[numD?'Average discount':'Orders discounted',pc(dv)],
    A.length>3&&net&&['Top 3 share',pc(A.slice(0,3).reduce((s,x)=>s+x.s,0)/net),'of '+S.da],pk&&['Peak period',lab(pk[0]),fmt(sum(pk[1],v))]].filter(Boolean);
  const ins=[];if(sc)ins.push(['g',`${rows.length} orders placed: ${ok.length} confirmed and ${ret.length} returned.`]);
  if(g!=null)ins.push([g>=0?'g':'a',`Net sales are ${g>=0?'up':'down'} ${pc(Math.abs(g))} over the last ${h} days versus the ${h} before.`]);
  ins.push(...segIns(A,S.da,net,mg),...(S.db!==S.da?segIns(B,S.db,net,mg).slice(0,3):[]));
  if(open.length&&net)ins.push(['a',`${fmt(sum(open,v))} (${pc(sum(open,v)/net)} of net sales) is confirmed but not delivered. Faster fulfilment turns it into cash.`]);
  if(ret.length)ins.push(['a',`Returns take out ${fmt(sum(ret,v))} of sales (${pc(ret.length/rows.length)} of orders).`]);
  if(m.length>3&&pk){const av=net/m.length;ins.push(['g',`${lab(pk[0])} is the strongest period, ${pc(sum(pk[1],v)/av-1)} above average. Plan stock and campaigns around it.`])}
  const dsc=numD?ok.filter(r=>r[R.disc]>0):[],nd=numD?ok.filter(r=>!(r[R.disc]>0)):[];
  if(R.cost&&dsc.length>20&&nd.length>20)ins.push(['a',`Discounted orders earn ${pc(1-sum(dsc,cs)/(sum(dsc,v)||1))} margin against ${pc(1-sum(nd,cs)/(sum(nd,v)||1))} at full price. Check the extra volume justifies it.`]);
  const sl=topN(A,5);
  return{hero:K.slice(0,4),mini:K.slice(4),tt:'Net sales'+(R.cost?' and gross profit':'')+' over time',ts:(D.fine?'Daily':'Monthly')+(sc?', returned orders excluded':''),labels:m.map(x=>lab(x[0])),
    ds:[{type:'bar',label:'Net sales',data:m.map(x=>sum(x[1],v)),backgroundColor:css('--c1'),borderRadius:4},...(R.cost?[{type:'line',label:'Gross profit',data:m.map(x=>sum(x[1],r=>v(r)-cs(r))),borderColor:css('--c3'),backgroundColor:css('--c3'),tension:.35,borderWidth:2.5,pointRadius:3}]:[])],
    mixT:sc?'Order status':'Top '+S.db,mix:(sc?[...grp(rows,sc)].map(([n,a])=>({n:/return/i.test(sc)?(/^(y|yes|true|1)$/i.test(n)?'Returned':'Confirmed'):n,v:a.length+' orders · '+fmt(sum(a,v)),w:100*a.length/rows.length})).sort((a,b)=>b.w-a.w):B.slice(0,6).map(x=>({n:x.n,v:fmt(x.s),w:100*x.s/(B[0].s||1)}))),
